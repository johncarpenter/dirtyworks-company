<!-- @dsCard group="Brand" viewport="900x760" name="Wordmark & favicon exports" subtitle="Source artboards for the PNG exports in assets/logo/" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:#8c8c88;font-family:var(--font-sans);display:grid;gap:22px;justify-items:start}
.wm{font-family:var(--font-display);font-weight:900;letter-spacing:-.035em;line-height:1;white-space:nowrap;display:inline-block}
.dot{color:var(--signal-orange)}
.pad{padding:56px 72px;display:inline-block}
.cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#f3ecdd}
.tile{display:grid;place-items:center;background:var(--ink);position:relative}
.tile span{font-family:var(--font-display);font-weight:900;color:var(--bone);letter-spacing:-.05em;line-height:1}
.row{display:flex;gap:20px;align-items:flex-end}
</style></head><body>
<div class="cap">Wordmark — ink on bone</div>
<div id="wm-ink-bone" class="pad" style="background:var(--bone)"><span class="wm" style="font-size:180px;color:var(--ink)">dirtyworks<span class="dot">.</span>ai</span></div>
<div class="cap">Wordmark — bone on ink</div>
<div id="wm-bone-ink" class="pad" style="background:var(--ink)"><span class="wm" style="font-size:180px;color:var(--bone)">dirtyworks<span class="dot">.</span>ai</span></div>
<div class="cap">Wordmark — transparent, ink</div>
<div id="wm-ink-alpha" style="display:inline-block"><span class="wm" style="font-size:180px;color:var(--ink)">dirtyworks<span class="dot">.</span>ai</span></div>
<div class="cap">Wordmark — transparent, bone</div>
<div id="wm-bone-alpha" style="display:inline-block"><span class="wm" style="font-size:180px;color:var(--bone)">dirtyworks<span class="dot">.</span>ai</span></div>
<div class="cap">Favicon / app mark — d. tile</div>
<div class="row">
<div id="fav-512" class="tile" style="width:512px;height:512px"><span style="font-size:300px">d<span class="dot">.</span></span></div>
<div id="fav-orange" class="tile" style="width:512px;height:512px;background:var(--signal-orange)"><span style="font-size:300px;color:var(--ink)">d<span class="dot" style="color:var(--bone)">.</span></span></div>
</div>
</body></html>
